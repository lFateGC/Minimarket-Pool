# ==============================================================================
# PROYECTO DE DESARROLLO WEB — MINIMARKET POOL
# Sistema de Gestión de Inventario y Comercialización
# Slogan: "Tu ahorro es nuestra prioridad"
# ==============================================================================
# Este archivo lee dinámicamente las variables desde el archivo .env o variables
# del sistema operativo, con valores por defecto seguros para desarrollo.
# ==============================================================================

# ------------------------------------------------------------------------------
# 1. CONEXIÓN A BASE DE DATOS (Mapeado desde .env)
# ------------------------------------------------------------------------------
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/gestion_inventario;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE}
spring.datasource.driver-class-name=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.database-platform=${DB_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.properties.hibernate.dialect=${DB_DIALECT:org.hibernate.dialect.H2Dialect}

# Consola web de base de datos H2 (disponible en http://localhost:8080/h2-console)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console

# ------------------------------------------------------------------------------
# 2. CONFIGURACIÓN JPA / HIBERNATE (ORM)
# ------------------------------------------------------------------------------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

